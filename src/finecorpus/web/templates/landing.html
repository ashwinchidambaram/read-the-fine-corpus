{% extends "base.html" %}
{% block title %}Home — Read The Fine Corpus{% endblock %}
{% block content %}
<section class="card">
  <header class="topbar">
    <h1>Read The Fine Corpus</h1>
    <form method="post" action="/logout" class="logout-form">
      <button type="submit" class="secondary">Sign out</button>
    </form>
  </header>
  <p>Signed in as <strong>{{ username }}</strong>.</p>
  <p class="muted">Read The Fine Corpus web UI (v{{ version }}).</p>
  <nav class="actions">
    <a class="button" href="/kb/new?mode=easy">Create a knowledge base (Easy)</a>
    <a class="button secondary" href="/kb/new?mode=proficient">Create a knowledge base (Proficient)</a>
  </nav>
</section>
{% endblock %}
