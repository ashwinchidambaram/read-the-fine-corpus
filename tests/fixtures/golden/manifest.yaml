- file: corpus/malformed_structure.pdf
  role: §18.1 Finding F-2 — PDF with deliberately corrupted FlateDecode content stream
    (unknown segment type coverage)
  generator: generators/gen_malformed_pdf.py
  content_summary: '2-page PDF (incident report). Page 1 (Incident Report content)
    is valid and should parse normally. Page 2''s FlateDecode content stream has 32 bytes
    of garbage injected at byte offset +8 inside the compressed body, causing the zlib
    decompressor itself to fail with an invalid-code-lengths error. The xref table
    remains intact so the file opens, but xref-following parsers cannot sidestep the
    broken filter. Tests the unknown segment type and parser robustness (§5.3 Finding
    F-2).

    '
  expected_segment_types:
  - prose
  - heading
  - unknown
  expected_tiers:
  - primary
  - supporting
  expected_triage_class: native_pdf
  expected_findings:
  - code: parse_error
    severity: warning
    location: page 2
  flags:
  - partial_parse
  - corrupted_content_stream_page_2
  sha256: d494775231248ad511b41fb0067b891da69cd1c9a0310a2a2c07154393138cfe
