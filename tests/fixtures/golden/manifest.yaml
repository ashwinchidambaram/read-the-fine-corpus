- file: corpus/adversarial.pdf
  role: §18.1 + §14.1 — adversarial PDF with injection-shaped text and invisible content
  generator: generators/gen_adversarial_pdf.py
  content_summary: '7-page document styled as an employee handbook. Contains six §14.1
    injection vectors: (1) visible prose injection "Ignore previous instructions..."
    (page 2, injection_suspicion >= 0.75; pipeline segment measures ~0.80 after pattern
    v2 fix; raw extraction measures ~0.83 on injection-only text); (2) fake SYSTEM:
    message block (page 3, injection_suspicion >= 0.7; measured ~0.71); (3) exfiltration
    instruction referencing evil.example (page 4, injection_suspicion >= 0.35;
    measured ~0.39); (4) white-on-white hidden text on page 5 (invisible_content_flags:
    white_on_white); (5) tiny-font run at font size 1pt on page 6
    (invisible_content_flags: tiny_font); (6) genuinely off-page text injected into page
    7 content stream at PDF y=-50pt, structurally outside the A4 MediaBox
    (0 0 595.28 841.89 pt) (invisible_content_flags: off_page). All injection text
    RETAINED not stripped (§14.1 labelled-not-sanitized). Non-negotiable test 9 fixture.
    Thresholds set to round values at or below measured reality (F-02 ruling).

    '
  expected_segment_types:
  - prose
  - heading
  - front_matter
  expected_tiers:
  - primary
  - supporting
  expected_triage_class: native_pdf
  expected_findings:
  - code: invisible_content_detected
    severity: warning
    location: page 5
    kind: white_on_white
  - code: invisible_content_detected
    severity: warning
    location: page 6
    kind: tiny_font
  - code: invisible_content_detected
    severity: warning
    location: page 7
    kind: off_page
  - code: injection_suspicion_high
    severity: warning
    location: page 2
    min_injection_suspicion: 0.75
  - code: injection_suspicion_high
    severity: warning
    location: page 3
    min_injection_suspicion: 0.7
  - code: injection_suspicion_high
    severity: warning
    location: page 4
    min_injection_suspicion: 0.35
  flags:
  - injection_visible_text_page_2
  - injection_system_message_page_3
  - injection_exfiltration_page_4
  - invisible_white_on_white_page_5
  - invisible_tiny_font_page_6
  - invisible_off_page_page_7
