{{- /*
corpus.yaml ConfigMap. Mounted at /app/config/corpus.yaml on every app pod;
the app reads it via FINECORPUS_CONFIG_PATH (src/finecorpus/config/loader.py).
Secrets are NEVER placed here — they are injected as env vars from the Secret.

The airgap assertion (M-013) runs here so an invalid air-gap config aborts the
whole render before anything is created.
*/ -}}
{{- include "finecorpus.airgapAssertion" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "finecorpus.fullname" . }}-config
  labels:
    {{- include "finecorpus.labels" . | nindent 4 }}
data:
  corpus.yaml: |
    # Generated by the finecorpus Helm chart. Do not edit in-cluster; change
    # Helm values and upgrade. Secrets are supplied via env vars, never here.
    platform:
      instance_name: {{ .Values.config.platform.instanceName | quote }}
      log_level: {{ .Values.config.platform.logLevel | quote }}
      # M-013: air-gap is driven by .Values.airgap and also enforced in-app via
      # RTFC_AIRGAP. When true the app blocks all outbound HTTP before any
      # provider call (src/finecorpus/llm/registry.py _is_airgap_active).
      airgap: {{ .Values.airgap }}
    {{- with .Values.config.providers }}
    providers:
      {{- range . }}
      - name: {{ .name | quote }}
        kind: {{ .kind | quote }}
        is_local: {{ .isLocal }}
        {{- if .baseUrl }}
        base_url: {{ .baseUrl | quote }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- with .Values.config.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
