{{- /*
Chart-managed Secret. Only rendered when secrets.existingSecret is empty.
Values are PLACEHOLDERS in values.yaml — override at install time via --set or a
gitignored values file, or supply your own Secret via secrets.existingSecret.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "finecorpus.fullname" . }}-secrets
  labels:
    {{- include "finecorpus.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required (override the CHANGE_ME placeholder)" .Values.secrets.postgresPassword | quote }}
  MINIO_ROOT_USER: {{ .Values.secrets.minioRootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ required "secrets.minioRootPassword is required (override the CHANGE_ME placeholder)" .Values.secrets.minioRootPassword | quote }}
{{- range $k, $v := .Values.secrets.providerApiKeys }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
