[project]
name = "finecorpus"
version = "0.0.1"
description = "Turns a heterogeneous document corpus into a production retrieval endpoint, and explains every decision it made along the way."
readme = "README.md"
authors = [
    { name = "Ashwin Chidambaram" }
]
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
