[project]
name = "finecorpus"
version = "0.0.1"
description = "Turns a heterogeneous document corpus into a production retrieval endpoint, and explains every decision it made along the way."
readme = "README.md"
authors = [
    { name = "Ashwin Chidambaram" }
]
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.8.0",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "pypdf>=6.16.2",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[project.scripts]
corpus = "finecorpus.cli.main:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.importlinter]
root_packages = ["finecorpus"]

[[tool.importlinter.contracts]]
name = "C-5: CLI and services must not be imported by core modules"
type = "forbidden"
source_modules = [
    "finecorpus.contracts",
    "finecorpus.pipeline",
    "finecorpus.config",
    "finecorpus.index",
    "finecorpus.control",
]
forbidden_modules = [
    "finecorpus.cli",
    "finecorpus.services",
]

[[tool.importlinter.contracts]]
name = "C-5: layers — cli/services sit above pipeline above config/index above embedding above control/contracts"
type = "layers"
layers = [
    "finecorpus.cli | finecorpus.services",
    "finecorpus.pipeline",
    "finecorpus.config | finecorpus.index",
    "finecorpus.embedding",
    "finecorpus.control | finecorpus.contracts",
]
exhaustive = false

[[tool.importlinter.contracts]]
name = "C-2: index adapter/qdrant must not import from control (pure adapter boundary)"
type = "forbidden"
source_modules = [
    "finecorpus.index.adapter",
    "finecorpus.index.qdrant",
]
forbidden_modules = [
    "finecorpus.control",
    "finecorpus.cli",
    "finecorpus.services",
]

[[tool.importlinter.contracts]]
name = "C-5b: control layer must not import from index (no circular dependency)"
type = "forbidden"
source_modules = [
    "finecorpus.control",
]
forbidden_modules = [
    "finecorpus.index",
    "finecorpus.cli",
    "finecorpus.services",
]

[dependency-groups]
dev = [
    "fpdf2>=2.7",
    "httpx>=0.28.1",
    "import-linter>=2.14",
    "mypy>=2.3.1",
    "openpyxl>=3.1",
    "pillow>=10.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0",
    "ruff>=0.16.6",
]
