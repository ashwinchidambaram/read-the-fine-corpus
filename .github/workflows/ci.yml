name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # System dependency for Phase 2 OCR (ScannedPDFParser — see docs/pipeline/assess.md).
      # Without tesseract-ocr, ScannedPDFParser returns an honest failed result rather than
      # crashing, but the test suite verifies real OCR output so the binary is required here.
      - name: Install system dependencies (tesseract-ocr)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr

      - run: uv sync

      - run: uv run ruff check .

      - run: uv run ruff format --check .

      - run: uv run mypy src/

      - run: uv run lint-imports

      - run: uv run pytest

  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline docs/ README.md
